<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Flowerz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: scroll;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ── BACKGROUND SLIDER ── */
        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .bg-slider .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            animation: bgFade 24s infinite;
        }

        .bg-slider .slide:nth-child(1) { animation-delay: 0s; }
        .bg-slider .slide:nth-child(2) { animation-delay: 6s; }
        .bg-slider .slide:nth-child(3) { animation-delay: 12s; }
        .bg-slider .slide:nth-child(4) { animation-delay: 18s; }

        @keyframes bgFade {
            0%   { opacity: 0; }
            8%   { opacity: 1; }
            25%  { opacity: 1; }
            33%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* ── CONTENT sits above background ── */
        ul, .box-container, footer {
            position: relative;
            z-index: 2;
        }

            /* ── NAVIGATION (unchanged styles, only margin & position tweaked) ── */
        ul {
            list-style-type: none;
            margin: 10px auto 0 auto;   /* consistent top margin */
            padding: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(245, 222, 179, 0.25);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 8px 32px rgba(104, 2, 141, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border-radius: 20px 20px 20px 20px;
            position: sticky;
            top: 10px;                 /* sticks with a small gap */
            display: flex;
            justify-content: center;
            width: fit-content;
        }

        li { display: block; }

        li a {
            display: block;
            color: #000000;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-family: cursive;
            transition: all 0.3s ease;
        }

        li a:hover:not(.active) {
            color: #68028d;
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
        }

        li a.active {
            color: #68028d;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
        }
        /* ── MAIN CARD (unchanged) ── */
       .box-container {
            width: 550px;
            height: 400px;
            display: flex;
            flex-direction: row;
            padding-left: 10px;
            padding: 20px;
            margin: 70px auto;
            background: rgba(255, 255, 255, 0.326);
            border-color: #ffffff;
            justify-content: center;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background-size: cover;
            box-shadow: 0 8px 32px 0 rgba(104, 2, 141, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        .box {
            width: 100%;
            text-align: center;
        }

        .box h1 {
            color: #68028d;
            font-family: cursive;
            font-size: 35px;
            font-weight: bolder;
            margin-top: 0;
        }

        #para {
            color: #000000;
            font-family: cursive;
        }

        #contact-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 0 20px;
        }

        #contact-form input,
        #contact-form textarea {
            width: 100%;
            max-width: 350px;
            padding: 12px 16px;
            font-family: cursive;
            font-size: 14px;
            color: #000000;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            outline: none;
            resize: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        #contact-form input::placeholder,
        #contact-form textarea::placeholder {
            color: rgba(0, 0, 0, 0.6);
        }

        #contact-form input:focus,
        #contact-form textarea:focus {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(104, 2, 141, 0.5);
        }

        #buttons {
            font-family: cursive;
            width: 150px;
            height: 50px;
            display: flex;
            background: rgba(95, 6, 125, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px auto 0 auto;
            box-shadow: 0 4px 16px rgba(104, 2, 141, 0.2);
        }

        #buttons:hover {
            background: rgba(95, 6, 125, 0.45);
            transform: translateY(-2px);
        }

        /* ── FOOTER (unchanged) ── */
        footer {
            margin-top: auto;
            background: rgba(245, 222, 179, 0.25);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 -8px 32px rgba(104, 2, 141, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 30px 20px 15px 20px;
            font-family: cursive;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            max-width: 900px;
            margin: 0 auto;
        }

        .footer-section {
            text-align: center;
            min-width: 150px;
        }

        .footer-section h3 {
            color: #68028d;
            margin-bottom: 10px;
        }

        .footer-section p,
        .footer-section a {
            color: #000000;
            display: block;
            text-decoration: none;
            margin: 6px 0;
            transition: color 0.3s ease;
        }

        .footer-section a:hover {
            color: #68028d;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            color: #000000;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .box-container {
                width: 100%;
                padding: 18px;
                margin: 30px auto;
            }
            .box h1 {
                font-size: 28px;
            }
            ul {
                padding: 4px 12px;
                gap: 4px;
            }
            li a {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            #contact-form input,
            #contact-form textarea {
                max-width: 100%;
            }
            .footer-content {
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <ul>

        <li><a class="active" href="contact.html">CONTACT</a></li>

    <br><br>

    <!-- ─── MAIN CONTENT ─── -->
    <div class="box-container">
        <div class="box">
            <h1>Get in Touch</h1>
            <div id="para"><p>We'd love to hear from you</p></div>
            <br />
            <form id="contact-form">
                <input type="text" name="name" placeholder="Your Name" required />
                <input type="email" name="email" placeholder="Your Email" required />
                <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
                <div id="buttons" onclick="document.getElementById('contact-form').requestSubmit()">Send Message</div>
            </form>
        </div>
    </div>

    <!-- ─── FOOTER ─── -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Flowerz</h3>
                <p>Farm-fresh blooms from Thrissur, delivered with care.</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>

        <div class="footer-bottom">
            <p>&copy; 2026 Flowerz. All rights reserved.</p>

    </footer>

</body>
</html>
